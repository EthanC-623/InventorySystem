{% load static %}

<!DOCTYPE html>
<html lang="en" dir="ltr" data-color-theme="Blue_Theme" class="light selected" data-layout="vertical"
	data-boxed-layout="boxed" data-card="shadow">

<head>
        <!-- Required meta tags -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon icon-->
    <link rel="shortcut icon" type="image/png" href="{% static 'assets/images/logos/favicon.png' %}" />
    <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
    <!-- Iconify / Solar Icons -->
        <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <!-- Core Css -->
    <link rel="stylesheet" href="{% static 'assets/css/theme.css' %}" />
        <title>TailwindAdmin TailwindCSS HTML Admin Template</title>
</head>

<body class="DEFAULT_THEME  bg-white dark:bg-dark">
    <main>
        <!-- start the project -->
        <div id="main-wrapper" class="flex">

            {% include 'sidebar.html' %}

            <!-- Page Wrapper -->
            <div class="page-wrapper flex-1">

                {% include 'header.html' %}

                <!-- Main Content -->
                <main class="max-w-full pt-6">
                    <div class="container full-container py-5">
                        <div class="grid grid-cols-12 gap-6">

                            {% block content %}
                            {% endblock %}

                        </div>
                    </div>
                </main>
                <!-- Main Content End -->

            </div>
            <!-- Page Wrapper End -->

        </div>
        <!-- end of project -->
    </main>
    
	<script src="{% static 'assets/js/vendor.min.js' %}"></script>
	<script src="{% static 'assets/js/theme/app.init.js' %}"></script>
    <script src="{% static 'assets/js/theme/app.min.js' %}"></script>
    <script src="{% static 'assets/js/theme.js' %}"></script>
    <script src="{% static 'assets/libs/simplebar/dist/simplebar.min.js' %}"></script>
    <script src="{% static 'assets/libs/preline/dist/preline.js' %}"></script>
    <script src="{% static 'assets/libs/@preline/input-number/index.js' %}"></script>
    <script src="{% static 'assets/libs/@preline/tooltip/index.js' %}"></script>
    <script src="{% static 'assets/libs/@preline/stepper/index.js' %}"></script>
    
    {% block extra_js %}
    {% endblock %} 

</body>
</html>
